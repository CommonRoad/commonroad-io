syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package commonroad_dynamic;

import "dynamic/obstacle.proto";
import "common/util.proto";

message EnvironmentObstacle {
    required uint32 environment_obstacle_id = 1;
    required ObstacleTypeEnum.ObstacleType obstacle_type = 2;
    required commonroad_common.Occupancy obstacle_shape = 3;
}
